name: Android CI and dev release
on:
  push:
    branches: [master, feature/android-raw-editor]
    paths: ["android/**", "mobile/**", "src/**", "tools/introspection/**", "tools/module-layout-tests/**", "tools/sidecar-tests/**", "CMakeLists.txt", "cmake/**", ".github/workflows/android-ci.yml"]
  pull_request:
    branches: [master]
    paths: ["android/**", "mobile/**", "src/**", "tools/introspection/**", "tools/module-layout-tests/**", "tools/sidecar-tests/**", "CMakeLists.txt", "cmake/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:
env:
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-26
  CMAKE_ANDROID_ARCH_ABI: arm64-v8a
  CMAKE_ANDROID_ARCH: aarch64
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg/2025.06.13
  VCPKG_DEFAULT_TRIPLET: arm64-android
  VCPKG_TARGET_TRIPLET: arm64-android
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-engine-adapter:
    # This checks the real adapter and pixelpipe. The Android dependency-only
    # build below cannot prove that RAW processing/edit/export actually works.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - name: Install desktop engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build build-essential pkg-config perl intltool gettext xsltproc \
            libgtk-3-dev liblensfun-dev libpotrace-dev libjson-glib-dev libexiv2-dev \
            libpugixml-dev libsqlite3-dev liblcms2-dev libjpeg-dev libpng-dev libtiff-dev \
            libxml2-dev libcurl4-gnutls-dev librsvg2-dev zlib1g-dev
      - name: Configure the real desktop engine adapter
        run: |
          cmake -S . -B build/mobile-engine -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBINARY_PACKAGE_BUILD=ON \
            -DBUILD_MOBILE_LIBRARY_ONLY=ON -DDT_MOBILE_BUILD_TESTS=ON \
            -DDT_MOBILE_WITH_GPR_SDK=ON -DRAWSPEED_ENABLE_DEBUG_INFO=OFF \
            -DDT_MOBILE_ANDROID_DEPENDENCIES=OFF -DBUILD_TESTING=OFF \
            -DUSE_LUA=OFF -DUSE_MAP=OFF -DBUILD_PRINT=OFF -DUSE_COLORD=OFF \
            -DUSE_KWALLET=OFF -DUSE_LIBSECRET=OFF -DUSE_GRAPHICSMAGICK=OFF \
            -DUSE_GMIC=OFF -DUSE_SDL2=OFF -DUSE_OPENCL=OFF -DUSE_AI=OFF \
            -DUSE_JXL=OFF -DUSE_AVIF=OFF -DUSE_HEIF=OFF -DUSE_OPENJPEG=OFF \
            -DUSE_WEBP=OFF -DUSE_OPENEXR=OFF -DUSE_XCF=ON -DUSE_ICU=OFF \
            -DUSE_CAMERA_SUPPORT=OFF -DUSE_PORTMIDI=OFF -DUSE_XMLLINT=OFF
      - name: Verify generated anonymous enum choices
        run: |
          cmake -S tools/introspection/tests -B build/introspection-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/introspection-tests --parallel 2
          ctest --test-dir build/introspection-tests --output-on-failure
      - name: Verify Android plugin classification and sidecar discovery
        run: |
          cmake -S tools/module-layout-tests -B build/module-layout-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/module-layout-tests --parallel 2
          ctest --test-dir build/module-layout-tests --output-on-failure
          cmake -S tools/sidecar-tests -B build/sidecar-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sidecar-tests --parallel 2
          ctest --test-dir build/sidecar-tests --output-on-failure
      - name: Build and verify editing and full resolution export
        run: |
          cmake --build build/mobile-engine --parallel 2 --target \
            dt_mobile_engine_test dt_mobile_raw_engine_test dt_mobile_rawspeed_gpr_test dt_mobile_api_test \
            dt_mobile_mock_api_test dt_mobile_gpr_test dt_mobile_temperature_test dt_mobile_zonemap_test \
            dt_mobile_locations_desktop_test dt_mobile_locations_android_test
          ctest --test-dir build/mobile-engine -R '^dt_mobile_' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-engine-adapter-diagnostics-${{ matrix.build_type }}
          path: |
            build/mobile-engine/Testing/**
            build/mobile-engine/CMakeFiles/CMakeConfigureLog.yaml
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Debug Android native target environment
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_NDK_HOME ANDROID_NDK_ROOT VCPKG_ROOT VCPKG_DEFAULT_TRIPLET VCPKG_TARGET_TRIPLET; do
            printf '%s=%s\n' "$name" "${!name-<unset>}"
          done
          printf 'CMAKE_TOOLCHAIN_FILE=%s\n' "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          env | LC_ALL=C sort | grep -E '^(ANDROID_(ABI|PLATFORM)|CMAKE_ANDROID_)' || true
      - uses: actions/cache@v4
        with:
          path: |
            .vcpkg/installed
            ~/.cache/vcpkg/archives
            ~/.cache/vcpkg/downloads
          key: android-native-${{ runner.os }}-arm64-api26-ndk27.2.12479018-vcpkg2025.06.13-${{ hashFiles('mobile/dependencies/**', '.gitmodules') }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Generate Gradle Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          wrapper_dir=$(mktemp -d)
          trap 'rm -rf "$wrapper_dir"' EXIT
          touch "$wrapper_dir/settings.gradle" "$wrapper_dir/build.gradle"
          gradle --no-daemon -p "$wrapper_dir" wrapper --gradle-version 8.14.4 --distribution-type bin --no-validate-url
          cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
      - uses: gradle/actions/wrapper-validation@v4
      - name: Native host test
        run: cmake -S mobile -B build/mobile -DDT_MOBILE_BUILD_TESTS=ON && cmake --build build/mobile && ctest --test-dir build/mobile --output-on-failure
      - name: Offline Android runtime staging and APK verification tests
        run: python3 -B -m unittest discover -s mobile/dependencies/tests -v
      - name: Lint, unit tests, and dev release
        working-directory: android
        run: ./gradlew --no-daemon lintDevRelease testDevReleaseUnitTest assembleDevRelease
      - name: Verify APK and checksum
        run: |
          APK=$(find android/app/build/outputs/apk/dev/release -name '*.apk' -print -quit)
          test -n "$APK"
          aapt2 dump badging "$APK" | tee android/app/build/outputs/apk/dev/release/manifest.txt
          aapt2 dump badging "$APK" | grep "package: name='org.example.darktableandroid.dev'"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libdt_mobile.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          for asset in cameras.xml noiseprofiles.json wb_presets.json; do unzip -l "$APK" | grep "assets/$asset"; done
          unzip -p "$APK" lib/arm64-v8a/libdt_mobile.so > /tmp/libdt_mobile.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d /tmp/libdt_mobile.so | tee /tmp/dt-mobile-elf.txt
          grep 'libc++_shared.so' /tmp/dt-mobile-elf.txt
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/dev/release/*.apk*
            android/app/build/outputs/apk/dev/release/manifest.txt
            android/app/build/outputs/mapping/devRelease/**
            android/app/build/outputs/native-debug-symbols/devRelease/**
            android/app/build/reports/**
            android/app/build/test-results/**
            build/mobile/Testing/**
